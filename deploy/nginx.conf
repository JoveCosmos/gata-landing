# ─────────────────────────────────────────────────────────────────────────
#  GATA HUB landing page — nginx server block
#
#  The page is static: no Node process in production. server.js in the repo
#  root is the local dev server only, and must not be deployed.
#
#  The three /api/ locations below are NOT optional. Neither status host
#  sends an Access-Control-Allow-Origin header, so the browser cannot read
#  them cross-origin; the Status section talks to these same-origin paths
#  instead. Without them the panel falls back to its "needs its proxy"
#  notice and no live figures appear.
#
#  Check with:
#    nginx -t
#    curl -s -o /dev/null -w '%{http_code}\n' https://gatahub.zone/api/uptime/status-page/validators
#    curl -s -o /dev/null -w '%{http_code}\n' https://gatahub.zone/api/kuma/status/validators
#    curl -s -o /dev/null -w '%{http_code}\n' https://gatahub.zone/api/betterstack/badge.json
#  All three must return 200.
# ─────────────────────────────────────────────────────────────────────────

# Micro-cache for the status feeds, so a burst of visitors does not become a
# burst against the monitors. This sits outside server{} on purpose — files in
# sites-enabled/ are included inside http{}, which is the context it needs.
proxy_cache_path /var/cache/nginx/gata_status levels=1:2 keys_zone=gata_status:8m
                 max_size=64m inactive=10m use_temp_path=off;

# ── canonical host ───────────────────────────────────────────────────────
server {
    # http2 on the listen line: the separate `http2 on;` directive only
    # exists from nginx 1.25.1, and this box runs 1.24.0.
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         gatahub.zone;

    # Certbot's managed TLS settings — protocols, cipher suite, session cache.
    # Carried over from the previous config; dropping them would quietly
    # downgrade the site's TLS.
    ssl_certificate     /etc/letsencrypt/live/gata-landing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gata-landing/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root                /var/www/gata-landing;
    index               index.html;

    # ── retired Next.js routes ──────────────────────────────────────────
    # This page replaces the old site, which answered these paths. Without
    # explicit redirects the try_files rule below would serve the landing
    # page at each of them — a soft 404, which is worse for search engines
    # and for anyone following an old link from the docs or socials.
    location = /infrastructure/validators { return 301 https://$host/#infrastructure; }
    location ^~ /infrastructure/          { return 301 https://$host/#infrastructure; }
    location = /nft-collections           { return 301 https://$host/#nfts; }
    location = /roadmap                   { return 301 https://docs.gatahub.zone/g/gatahub/gata-hub-road-map; }

    # /rewards is deliberately left unclaimed for the incoming reward app.
    # Redirecting it here would intercept the path before that app could be
    # mounted on it. Until then it falls through to the landing page.

    # ── compression ─────────────────────────────────────────────────────
    # index.html is ~68KB of inline CSS/JS and gzips to ~18KB. The WebP
    # images are already compressed; do not waste CPU on them.
    gzip                on;
    gzip_vary           on;
    gzip_min_length     1024;
    gzip_types          text/html text/css application/javascript application/json image/svg+xml;

    # ── caching ─────────────────────────────────────────────────────────
    # All CSS and JS is inline in index.html, so a stale HTML means a stale
    # site: never cache it. Fingerprint-free assets get a short-ish cache;
    # raise to immutable/1y only if you start versioning filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        access_log  off;
        add_header  Cache-Control "public, max-age=604800";
        try_files   $uri =404;
    }

    # Fonts never change under these filenames, so they can be pinned hard.
    location /assets/fonts/ {
        access_log  off;
        add_header  Cache-Control "public, max-age=31536000, immutable";
        types       { font/woff2 woff2; }
        default_type font/woff2;
        try_files   $uri =404;
    }

    # ── keep dev files off the public web ───────────────────────────────
    # Only index.html and assets/ need to be deployed. This is a backstop in
    # case the whole repo is synced to the docroot.
    location ~ ^/(server\.js|package(-lock)?\.json|node_modules|deploy)(/|$) {
        return 404;
    }
    location ~ /\. {
        deny all;
    }

    # ── status feed: Uptime Kuma API ────────────────────────────────────
    # proxy_ssl_server_name is required — without SNI the TLS handshake to
    # the upstream fails. A literal hostname in proxy_pass is resolved once
    # at config load, which is fine for a host you control.
    location /api/uptime/ {
        proxy_pass              https://uptime.gatadao.com/api/;
        proxy_set_header        Host uptime.gatadao.com;
        proxy_ssl_server_name   on;
        proxy_ssl_name          uptime.gatadao.com;
        proxy_connect_timeout   5s;
        proxy_read_timeout      10s;

        proxy_cache             gata_status;
        proxy_cache_valid       200 20s;
        proxy_cache_valid       any 5s;
        proxy_cache_use_stale   error timeout updating http_502 http_503 http_504;
        proxy_cache_lock        on;
        add_header              X-Cache-Status $upstream_cache_status;
    }

    # ── status feed: the Kuma status page itself ────────────────────────
    # Powers the "Kuma" service card. Deliberately uncached, or the card
    # would report a healthy page from cache while Kuma is down.
    location /api/kuma/ {
        proxy_pass              https://uptime.gatadao.com/;
        proxy_set_header        Host uptime.gatadao.com;
        proxy_ssl_server_name   on;
        proxy_ssl_name          uptime.gatadao.com;
        proxy_connect_timeout   5s;
        proxy_read_timeout      10s;
    }

    # ── status feed: BetterStack ────────────────────────────────────────
    # Hosted behind a CDN whose address rotates, so this one resolves at
    # request time via a variable + resolver rather than being pinned at
    # config load. Using a variable disables nginx's automatic URI
    # rewriting, hence the explicit rewrite.
    location /api/betterstack/ {
        resolver                1.1.1.1 8.8.8.8 valid=60s ipv6=off;
        set $betterstack        gatahub.gatadao.com;
        rewrite ^/api/betterstack/(.*)$ /$1 break;
        proxy_pass              https://$betterstack;
        proxy_set_header        Host gatahub.gatadao.com;
        proxy_ssl_server_name   on;
        proxy_ssl_name          gatahub.gatadao.com;
        proxy_connect_timeout   5s;
        proxy_read_timeout      10s;

        proxy_cache             gata_status;
        proxy_cache_valid       200 20s;
        proxy_cache_use_stale   error timeout updating http_502 http_503 http_504;
        proxy_cache_lock        on;
    }

    # ── the page ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Content-Security-Policy ─────────────────────────────────────────
    # Fonts are self-hosted and there are no other third-party subresources,
    # so this is fully same-origin. 'unsafe-inline' is required because the
    # page's CSS and JS live in inline <style>/<script> blocks — swap it for
    # a nonce if you ever move them to files.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}

# ── www -> apex ──────────────────────────────────────────────────────────
# One canonical hostname. Serving the page on both would split search
# ranking between them for no benefit.
server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         www.gatahub.zone;

    # www has its own certificate, separate from the apex one — these paths
    # are taken from the previous www.gatahub.zone config. TLS is terminated
    # here purely so the redirect below can be issued; a browser reaching
    # www still needs a valid handshake before it can be sent anywhere.
    ssl_certificate     /etc/letsencrypt/live/gata-landing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gata-landing/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://gatahub.zone$request_uri;
}

# ── plain http -> https ──────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name gatahub.zone www.gatahub.zone;

    # Let certbot answer HTTP-01 challenges. Without this the redirect below
    # swallows the challenge request and renewal fails — quietly, sixty days
    # from now. Verify after cutover with `sudo certbot renew --dry-run`.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/html;
        default_type "text/plain";
        try_files    $uri =404;
    }

    location / {
        return 301 https://gatahub.zone$request_uri;
    }
}
